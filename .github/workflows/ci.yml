name: comprobaciones

on:
  push:
  pull_request:

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar claves (archivos e historial)
        run: |
          bash tools/escanear_claves.sh
          bash tools/escanear_claves.sh --historial
          echo "Sin claves."
      - name: Datos personales sin anonimizar
        run: python3 tools/anonimizar.py --solo-comprobar $(git ls-files | grep -v '^tools/')

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas que no necesitan el PC
        run: python tests/test_basico.py
