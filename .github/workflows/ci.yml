name: comprobaciones

on:
  push:
  pull_request:

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar claves (archivos e historial)
        run: |
          PAT='sk-ant-[A-Za-z0-9_-]{10,}|gsk_[A-Za-z0-9]{20,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|AIza[0-9A-Za-z_-]{30,}|sk-or-v1-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git ls-files -z | xargs -0 grep -nIE "$PAT"; then echo "Hay algo que parece una clave"; exit 1; fi
          if git log -p --all | grep -qE "$PAT"; then echo "Hay algo que parece una clave en el historial"; exit 1; fi
          if git ls-files | grep -E '(^|/)\.env$|\.key$|clave\.hash'; then echo "Archivo de claves en el repo"; exit 1; fi
          echo "Sin claves."

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas que no necesitan el PC
        run: python tests/test_basico.py
