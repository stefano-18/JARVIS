# Reglas declarativas de make_release.py (release compartible, 1 commit).
# - excluir: rutas/prefijos a no exportar (relativos a la raíz).
# - sustituir: reemplazos EXACTOS (buscar debe aparecer `veces`, si no FAIL).

# - prohibido: regex que deben dar 0 coincidencias tras transformar (FAIL si no).
# - gitleaks_permitido: hallazgos ya triados como sintéticos (fichero + regla).

