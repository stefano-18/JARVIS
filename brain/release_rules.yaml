  - archivo: "agent_pc/install_agent.ps1"
    buscar: |2
      param(
        [Parameter(Mandatory = $true)][string]$SharedSecret,
        [string]$HubHost = "",
        [string]$DeviceId = "",
        [string]$Roots = "%USERPROFILE%\JARVIS"
      )
    reemplazo: |2
      param(
        [string]$SharedSecret = "",
        [string]$HubHost = "",
        [string]$DeviceId = "",
        [string]$Roots = "%USERPROFILE%\JARVIS",
        [string]$ConfigFile = ""
      )
      # Si viene -ConfigFile (pc_agent_config.json del --export-pc-config),
      # manda sobre los parámetros y se BORRA tras escribir el .env.
      if ($ConfigFile -ne "") {
        $cfg = Get-Content -LiteralPath $ConfigFile -Encoding UTF8 |
          ConvertFrom-Json
        if ($cfg.SECRET) { $SharedSecret = $cfg.SECRET }
        if ($cfg.HUB_HOST) { $HubHost = $cfg.HUB_HOST }
        if ($cfg.DEVICE_ID) { $DeviceId = $cfg.DEVICE_ID }
      }
      if ($SharedSecret -eq "") { throw "Falta -SharedSecret (o -ConfigFile con SECRET)." }

