      def test_v1_tampoco_es_destino(monkeypatch, tmp_path):
          monkeypatch.setenv("TELEGRAM_ALLOWED_CHAT_IDS", "11")
          monkeypatch.setattr(ACL, "V1_LAST_CHAT", tmp_path / "v1.txt")
          (tmp_path / "v1.txt").write_text("777\n", encoding="utf-8")
